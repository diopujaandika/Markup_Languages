<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Cards</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

  <div class="card-container">
    
    <div class="card">
      <div class="image-wrapper">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=600" alt="Sophie Bennett">
      </div>
      <div class="card-content">
        <div class="header">
          <h3>Sophie Bennett</h3>
          <i class="ri-checkbox-circle-fill verified-icon green"></i>
        </div>
        <p class="bio">Product Designer who focuses on simplicity & usability.</p>
        <div class="footer">
          <div class="stats">
            <span><i class="ri-user-line"></i> 312</span>
            <span><i class="ri-checkbox-line"></i> 48</span>
          </div>
          <button class="btn-follow">Follow <i class="ri-add-line"></i></button>
        </div>
      </div>
    </div>

    <div class="card card-glass-light">
      <div class="background-img">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=600" alt="Sophie Bennett">
      </div>
      <div class="card-content">
        <div class="header">
          <h3>Sophie Bennett</h3>
          <i class="ri-checkbox-circle-fill verified-icon green"></i>
        </div>
        <p class="bio">Product Designer who focuses on simplicity & usability.</p>
        <div class="footer">
          <div class="stats">
            <span><i class="ri-user-line"></i> 312</span>
            <span><i class="ri-checkbox-line"></i> 48</span>
          </div>
          <button class="btn-follow">Follow <i class="ri-add-line"></i></button>
        </div>
      </div>
    </div>

    <div class="card card-glass-dark">
      <div class="background-img">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=600" alt="Sophie Bennett">
      </div>
      <div class="card-content">
        <div class="header">
          <h3 class="text-white">Sophie Bennett</h3>
          <i class="ri-checkbox-circle-fill verified-icon white"></i>
        </div>
        <p class="bio text-light">A Product Designer focused on intuitive user experiences.</p>
        <div class="footer text-white">
          <div class="stats">
            <span><i class="ri-user-line"></i> 312</span>
            <span><i class="ri-checkbox-line"></i> 48</span>
          </div>
          <button class="btn-follow dark-btn">Follow <i class="ri-add-line"></i></button>
        </div>
      </div>
    </div>

  </div>
<script src="script.js"></script>
</body>
</html>
